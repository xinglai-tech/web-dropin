<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyen test – Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/i18n.js"></script>
  <style>
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      padding: 32px;
      margin: 60px 16px 32px;
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .error-msg.show { display: block; }
    .ip-msg {
      background: #fff7ed;
      color: #9a3412;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
      text-align: center;
      word-break: break-all;
    }
    .ip-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Adyen test</h1>
    <p data-i18n="login.subtitle">Please sign in to continue</p>
  </div>

  <div class="login-card">
    <h2 data-i18n="login.signin">Sign In</h2>
    <div class="error-msg" id="errorMsg"></div>
    <div class="ip-msg" id="ipMsg"></div>
    <form action="/auth/login" method="POST">
      <div class="form-group">
        <label for="code" data-i18n="login.accessCode">Access Code</label>
        <input type="password" id="code" name="code" required autocomplete="one-time-code" inputmode="numeric" />
      </div>
      <button class="btn" type="submit" data-i18n="login.button">Login</button>
    </form>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      const errorMsg = document.getElementById('errorMsg');
      if (err === 'locked') {
        errorMsg.textContent = (window.t && t('login.locked')) || 'Too many failed attempts. Please try again later.';
        errorMsg.classList.add('show');
      } else if (err) {
        errorMsg.textContent = (window.t && t('login.error')) || 'Invalid access code';
        errorMsg.classList.add('show');
      }
      if (params.get('showip') === '1') {
        fetch('/whoami')
          .then((r) => r.json())
          .then((d) => {
            const label = (window.t && t('login.yourIp')) || 'Your IP address:';
            const ipMsg = document.getElementById('ipMsg');
            ipMsg.textContent = ''; // safe: build via text nodes
            const strong = document.createElement('strong');
            strong.textContent = d.ip || 'unknown';
            ipMsg.appendChild(document.createTextNode(label + ' '));
            ipMsg.appendChild(strong);
            ipMsg.classList.add('show');
          })
          .catch(() => {});
      }
    })();
  </script>
</body>
</html>
