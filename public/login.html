<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyen live – Login</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      padding: 32px;
      margin: 60px 16px 32px;
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Adyen live</h1>
    <p>Please sign in to continue</p>
  </div>

  <div class="login-card">
    <h2>Sign In</h2>
    <div class="error-msg" id="errorMsg">Invalid username or password</div>
    <form action="/auth/login" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button class="btn" type="submit">Login</button>
    </form>
  </div>

  <footer style="text-align:center;margin-top:2rem;padding:1rem;color:#888;font-size:0.9rem;">Internal use only</footer>

  <script>
    if (new URLSearchParams(window.location.search).has('error')) {
      document.getElementById('errorMsg').classList.add('show');
    }
  </script>
</body>
</html>
