<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyen test</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .logout-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    @media (max-width: 600px) {
      .logout-btn {
        font-size: 0.75rem !important;
        padding: 5px 7px !important;
        border-width: 1.5px !important;
        top: 18px !important;
        right: 8px !important;
      }
      .header {
        padding-bottom: 18px !important;
      }
      .header p {
        margin-top: 20px !important;
      }
    }
  </style>
</head>
<body>
  <div class="header" style="position:relative;">
    <a href="/auth/logout" class="logout-btn" style="position:absolute;top:8px;right:16px;color:#fff;font-size:0.95rem;font-weight:400;text-decoration:none;padding:5px 6px;border:2px solid rgba(255,255,255,0.9);border-radius:4px;transition:background 0.2s;">Logout</a>
    <h1>Adyen test</h1>
    <p style="margin-top:12px;">Select country, currency &amp; amount to start checkout</p>
  </div>

  <div class="card">
    <h2>Payment Settings</h2>

    <div class="form-group">
      <label for="country">Country</label>
      <select id="country">
        <option value="AU">Australia</option>
        <option value="BR">Brazil</option>
        <option value="CA">Canada</option>
        <option value="DK">Denmark</option>
        <option value="FI">Finland</option>
        <option value="FR">France</option>
        <option value="DE">Germany</option>
        <option value="HK">Hong Kong</option>
        <option value="JP">Japan</option>
        <option value="MY">Malaysia</option>
        <option value="NL">Netherlands</option>
        <option value="NO">Norway</option>
        <option value="SG" selected>Singapore</option>
        <option value="KR">South Korea</option>
        <option value="SE">Sweden</option>
        <option value="TH">Thailand</option>
        <option value="GB">United Kingdom</option>
        <option value="US">United States</option>
      </select>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="currency">Currency</label>
        <select id="currency">
          <option value="AUD">AUD</option>
          <option value="BRL">BRL</option>
          <option value="CAD">CAD</option>
          <option value="DKK">DKK</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="HKD">HKD</option>
          <option value="JPY">JPY</option>
          <option value="KRW">KRW</option>
          <option value="MYR">MYR</option>
          <option value="NOK">NOK</option>
          <option value="SEK">SEK</option>
          <option value="SGD" selected>SGD</option>
          <option value="THB">THB</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div class="form-group">
        <label for="amount">Amount (minor units)</label>
        <input type="number" id="amount" value="10" min="1" max="5000" />
        <span id="amountError" style="display:none;color:#dc2626;font-size:0.8rem;margin-top:4px;">Amount must be between 1 and 5000</span>
      </div>
    </div>

    <div class="form-group">
      <label for="channel">Channel</label>
      <select id="channel">
        <option value="Web" selected>Web</option>
        <option value="iOS">iOS</option>
        <option value="Android">Android</option>
      </select>
    </div>

    <div class="form-group">
      <label for="shopperInteraction">Shopper Interaction</label>
      <select id="shopperInteraction">
        <option value="Ecommerce" selected>Ecommerce</option>
        <option value="ContAuth">ContAuth</option>
      </select>
    </div>

    <div class="form-group">
      <label for="recurringModel">Recurring Processing Model (optional)</label>
      <select id="recurringModel">
        <option value="" selected>None</option>
        <option value="CardOnFile">CardOnFile</option>
        <option value="Subscription">Subscription</option>
        <option value="UnscheduledCardOnFile">UnscheduledCardOnFile</option>
      </select>
    </div>

    <div class="form-group">
      <label for="shopperRef">Shopper Reference</label>
      <input type="text" id="shopperRef" value="user_shanghai" />
    </div>

    <div class="form-group">
      <label for="merchantRef">Merchant Reference (optional)</label>
      <input type="text" id="merchantRef" placeholder="Leave empty to auto-generate" />
    </div>

    <button class="btn" id="startBtn">Continue to Checkout</button>
  </div>

  <script>
    // Default mapping country → currency
    const countryCurrency = {
      SG: 'SGD', US: 'USD', GB: 'GBP', NL: 'EUR', DE: 'EUR', FR: 'EUR',
      AU: 'AUD', JP: 'JPY', HK: 'HKD', SE: 'SEK', NO: 'NOK',
      FI: 'EUR', DK: 'DKK', CA: 'CAD', BR: 'BRL', MY: 'MYR',
      TH: 'THB', KR: 'KRW',
    };

    const countryEl = document.getElementById('country');
    const currencyEl = document.getElementById('currency');

    countryEl.addEventListener('change', () => {
      const mapped = countryCurrency[countryEl.value];
      if (mapped) currencyEl.value = mapped;
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const amountVal = parseInt(document.getElementById('amount').value, 10);
      const errorEl = document.getElementById('amountError');
      if (isNaN(amountVal) || amountVal < 1 || amountVal > 5000) {
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';
      const params = new URLSearchParams({
        country: countryEl.value,
        currency: currencyEl.value,
        amount: amountVal,
        channel: document.getElementById('channel').value,
      });
      params.set('shopperInteraction', document.getElementById('shopperInteraction').value);
      const recurringModel = document.getElementById('recurringModel').value;
      if (recurringModel) params.set('recurringModel', recurringModel);
      const shopperRef = document.getElementById('shopperRef').value.trim();
      if (shopperRef) params.set('shopperRef', shopperRef);
      const ref = document.getElementById('merchantRef').value.trim();
      if (ref) params.set('merchantRef', ref);
      window.location.href = '/checkout.html?' + params.toString();
    });
  </script>

  <footer style="text-align:center;margin-top:2rem;padding:1rem;color:#888;font-size:0.9rem;"> Internal use only</footer>
</body>
</html>
