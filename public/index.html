<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyen live</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="header">
    <h1>Adyen live</h1>
    <p>Select country, currency &amp; amount to start checkout</p>
  </div>

  <div class="card">
    <h2>Payment Settings</h2>

    <div class="form-group">
      <label for="country">Country</label>
      <select id="country">
        <option value="AU">Australia</option>
        <option value="BR">Brazil</option>
        <option value="CA">Canada</option>
        <option value="DK">Denmark</option>
        <option value="FI">Finland</option>
        <option value="FR">France</option>
        <option value="DE">Germany</option>
        <option value="HK">Hong Kong</option>
        <option value="IN">India</option>
        <option value="JP">Japan</option>
        <option value="MY">Malaysia</option>
        <option value="NL">Netherlands</option>
        <option value="NO">Norway</option>
        <option value="SG" selected>Singapore</option>
        <option value="KR">South Korea</option>
        <option value="SE">Sweden</option>
        <option value="TH">Thailand</option>
        <option value="GB">United Kingdom</option>
        <option value="US">United States</option>
      </select>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="currency">Currency</label>
        <select id="currency">
          <option value="AUD">AUD</option>
          <option value="BRL">BRL</option>
          <option value="CAD">CAD</option>
          <option value="DKK">DKK</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="HKD">HKD</option>
          <option value="INR">INR</option>
          <option value="JPY">JPY</option>
          <option value="KRW">KRW</option>
          <option value="MYR">MYR</option>
          <option value="NOK">NOK</option>
          <option value="SEK">SEK</option>
          <option value="SGD" selected>SGD</option>
          <option value="THB">THB</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div class="form-group">
        <label for="amount">Amount (minor units)</label>
        <input type="number" id="amount" value="1000" min="1" />
      </div>
    </div>

    <div class="form-group">
      <label for="channel">Channel</label>
      <select id="channel">
        <option value="Web" selected>Web</option>
        <option value="iOS">iOS</option>
        <option value="Android">Android</option>
      </select>
    </div>

    <button class="btn" id="startBtn">Continue to Checkout</button>
  </div>

  <script>
    // Default mapping country → currency
    const countryCurrency = {
      SG: 'SGD', US: 'USD', GB: 'GBP', NL: 'EUR', DE: 'EUR', FR: 'EUR',
      AU: 'AUD', JP: 'JPY', HK: 'HKD', SE: 'SEK', NO: 'NOK',
      FI: 'EUR', DK: 'DKK', CA: 'CAD', BR: 'BRL', IN: 'INR', MY: 'MYR',
      TH: 'THB', KR: 'KRW',
    };

    const countryEl = document.getElementById('country');
    const currencyEl = document.getElementById('currency');

    countryEl.addEventListener('change', () => {
      const mapped = countryCurrency[countryEl.value];
      if (mapped) currencyEl.value = mapped;
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const params = new URLSearchParams({
        country: countryEl.value,
        currency: currencyEl.value,
        amount: document.getElementById('amount').value,
        channel: document.getElementById('channel').value,
      });
      window.location.href = '/checkout.html?' + params.toString();
    });
  </script>
  <footer style="text-align:center;margin-top:2rem;padding:1rem;color:#888;font-size:0.9rem;"> Internal use only</footer>
</body>
</html>
