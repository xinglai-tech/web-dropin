    /* Taller header so the stacked logout + language switch fit inside. */

    /* Logout button + segmented language switch, top-right of the header. */
    .logout-btn {
      position: absolute;
      top: 8px;
      right: 16px;
      width: 96px;
      box-sizing: border-box;
      text-align: center;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      background: transparent;
      padding: 5px 0;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.2); }

    /* Segmented EN | 中文 control */
    .lang-switch {
      position: absolute;
      top: 52px;
      right: 16px;
      display: inline-flex;
      width: 96px;
      box-sizing: border-box;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
    }
    .lang-seg {
      flex: 1 1 0;
      min-width: 0;
      padding: 4px 0;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease;
    }
    .lang-seg + .lang-seg { border-left: 1px solid rgba(255,255,255,0.55); }
    .lang-seg:hover:not(.active) { background: rgba(255,255,255,0.18); }
    .lang-seg.active {
      background: #fff;
      color: #4A8DAB;
      font-weight: 700;
    }
    @media (max-width: 600px) {

    .preset-btn {

    /* ── Custom Select ──────────────────────────────────── */
    .csel { position: relative; width: 100%; }
    .csel__trigger {

      width: 100%; height: 38px; padding: 0 12px;

    .csel__arrow {

    .csel.open .csel__arrow { transform: rotate(-135deg); margin-top: 3px; }
    .csel__options {

    .csel__opt {

    .csel__opt:first-child { border-radius: 7px 7px 0 0; }

    .csel__opt.selected { background: #e8f4f8; color: #4A8DAB; font-weight: 600; }
    .csel__options::-webkit-scrollbar { width: 6px; }

    .csel--disabled { opacity: 0.45; pointer-events: none; }

    label.checkbox-label {

      font-size: 0.85rem; font-weight: 600; color: #555;
      -webkit-user-select: none; -moz-user-select: none; user-select: none;

    label.checkbox-label input[type="checkbox"] {

    }
    label.checkbox-label span { flex: 1 1 auto; }

    /* Keep label heights consistent whether or not they contain an info icon */
    .form-group > label { min-height: 20px; line-height: 20px; }

    /* Slimmer Billing Address Mode dropdown + smaller Full/Partial text */
    .csel[data-id="billingAddressMode"] .csel__trigger { height: 30px; }

    /* ── Info tooltip ──────────────────────────────────────────────────── */
    .info-tip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      margin-left: 6px;
      border-radius: 50%;
      background: #b9c6cf;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      font-style: normal;
      font-family: inherit;
      cursor: help;
      position: relative;
      vertical-align: middle;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .info-tip:hover {
      background: #4A8DAB;
    }
    .info-tip::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 9px);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 320px;
      background: #fff;
      color: #33556a;
      border: 1px solid #dce6ec;
      text-align: left;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 400;
      font-style: normal;
      font-family: inherit;
      line-height: 1.55;
      letter-spacing: normal;
      text-transform: none;
      white-space: pre-line;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s;
      z-index: 120;
      pointer-events: none;
    }
    .info-tip::before {
      content: '';
      position: absolute;
      bottom: calc(100% + 3px);
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: #fff;
      filter: drop-shadow(0 1px 0 #dce6ec);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s;
      z-index: 120;
      pointer-events: none;
    }
    .info-tip:hover::after,
    .info-tip:focus::after,
    .info-tip:hover::before,
    .info-tip:focus::before {
      opacity: 1;
      visibility: visible;
    }

  </main>

  <dialog id="presetDialog" class="preset-dialog" aria-labelledby="presetDialogTitle">
    <div class="preset-dialog__header">
      <span id="presetDialogTitle" data-i18n="preset.mobileTitle">Test scenarios</span>
      <button type="button" class="dialog-close" id="closePresets" aria-label="Close">×</button>
    </div>
  </dialog>

  <script src="/vendor/tom-select/js/tom-select.complete.min.js"></script>
  <script>
    // ── Select controls ──────────────────────────────────────────────────
    function cselVal(id) {
      const nativeSelect = document.getElementById(id);
      if (nativeSelect && nativeSelect.tagName === 'SELECT') return nativeSelect.value;
      return document.querySelector(`.csel[data-id="${id}"]`).dataset.value;
    }
    function cselSet(id, val) {
      const nativeSelect = document.getElementById(id);
      if (nativeSelect && nativeSelect.tagName === 'SELECT') {
        const option = Array.from(nativeSelect.options).find((item) => item.value === val);
        if (!option) return;
        nativeSelect.value = val;
        if (nativeSelect.tomselect) nativeSelect.tomselect.setValue(val, true);
        nativeSelect.dispatchEvent(new Event('change'));
        return;
      }
      const el = document.querySelector(`.csel[data-id="${id}"]`);
      const opt = el.querySelector(`.csel__opt[data-value="${val}"]`);
      if (!opt) return;
      el.dataset.value = val;
      el.querySelector('.csel__trigger span').textContent = opt.textContent;
      el.querySelectorAll('.csel__opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    }

    function renderFlaggedOption(data, escape) {
      const flag = data.flag ? `<span class="fi fi-${escape(data.flag)}" aria-hidden="true"></span>` : '';
      return `<span>${flag}<span>${escape(data.text)}</span></span>`;
    }
    function initEnhancedSelects() {
      document.querySelectorAll('.enhanced-select').forEach((select) => {
        if (select.tomselect) return;
        new TomSelect(select, {
          allowEmptyOption: false,
          closeAfterSelect: true,
          controlInput: null,
          create: false,
          maxOptions: null,
          render: { option: renderFlaggedOption, item: renderFlaggedOption },
        });
      });
    }
    function refreshEnhancedSelectLabels() {
      document.querySelectorAll('.enhanced-select').forEach((select) => {
        const control = select.tomselect;
        if (!control) return;
        Array.from(select.options).forEach((option) => {
          control.updateOption(option.value, { value: option.value, text: option.textContent, flag: option.dataset.flag || '' });
        });
        control.refreshItems();
        control.refreshOptions(false);
      });
    }
    document.addEventListener('DOMContentLoaded', initEnhancedSelects);
    document.addEventListener('langchange', refreshEnhancedSelectLabels);

    document.querySelectorAll('.csel').forEach(sel => {
      const trigger = sel.querySelector('.csel__trigger');
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.csel.open').forEach(s => { if (s !== sel) s.classList.remove('open'); });
        sel.classList.toggle('open');
      });
      sel.querySelectorAll('.csel__opt').forEach(opt => {
        opt.addEventListener('click', () => {
          sel.dataset.value = opt.dataset.value;
          sel.querySelector('.csel__trigger span').textContent = opt.textContent;
          sel.querySelectorAll('.csel__opt').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          sel.classList.remove('open');
          sel.dispatchEvent(new Event('change'));
        });
      });
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('.csel.open').forEach(s => s.classList.remove('open'));
    });

    // ── Country → Currency mapping ───────────────────────────────────────
    const countryCurrency = {
      SG: 'SGD', US: 'USD', GB: 'GBP', NL: 'EUR', DE: 'EUR', FR: 'EUR',
      AU: 'AUD', JP: 'JPY', HK: 'HKD', SE: 'SEK', NO: 'NOK',
      FI: 'EUR', DK: 'DKK', CA: 'CAD', BR: 'BRL', MY: 'MYR',
      TH: 'THB', KR: 'KRW', IT: 'EUR', ES: 'EUR', BE: 'EUR', NZ: 'NZD',
      MX: 'MXN',
    };
    // ── Installments availability by country (MX / BR / JP) ─────────────
    const INSTALLMENT_COUNTRIES = ['MX', 'BR', 'JP'];
    const installmentsCsel = document.querySelector('.csel[data-id="installments"]');
    function updateInstallmentsAvailability() {
      const supported = INSTALLMENT_COUNTRIES.includes(cselVal('country'));
      installmentsCsel.classList.toggle('csel--disabled', !supported);
      if (!supported) {
        installmentsCsel.classList.remove('open');
        if (cselVal('installments') !== 'off') cselSet('installments', 'off');
      }
    }

    const countrySelect = document.getElementById('country');
    countrySelect.addEventListener('change', () => {
      const mapped = countryCurrency[cselVal('country')];
      if (mapped) cselSet('currency', mapped);
      updateInstallmentsAvailability();
    });
    updateInstallmentsAvailability();

    // ── Billing address required → enable/disable mode select ────────────
    const billingReqEl = document.getElementById('billingAddressRequired');
    const billingModeCsel = document.querySelector('.csel[data-id="billingAddressMode"]');
    billingReqEl.addEventListener('change', () => {
      billingModeCsel.classList.toggle('csel--disabled', !billingReqEl.checked);
      if (!billingReqEl.checked) billingModeCsel.classList.remove('open');
    });

    // ── Submit ───────────────────────────────────────────────────────────
    document.getElementById('startBtn').addEventListener('click', () => {
      const amountVal = parseFloat(document.getElementById('amount').value);
      const errorEl = document.getElementById('amountError');
      const emailEl = document.getElementById('shopperEmail');
      const emailErrEl = document.getElementById('emailError');
      const emailRaw = emailEl.value.trim();
      const emailValid = !emailRaw || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailRaw);

      let hasError = false;
      if (isNaN(amountVal) || amountVal < 0.01) {
        errorEl.style.display = 'block';
        document.getElementById('amount').setAttribute('aria-invalid', 'true');
        hasError = true;
      } else {
        errorEl.style.display = 'none';
        document.getElementById('amount').removeAttribute('aria-invalid');
      }
      if (!emailValid) {
        emailErrEl.style.display = 'block';
        emailEl.setAttribute('aria-invalid', 'true');
        hasError = true;
      } else {
        emailErrEl.style.display = 'none';
        emailEl.removeAttribute('aria-invalid');
      }
      if (hasError) {
        (document.querySelector('[aria-invalid="true"]') || document.getElementById('amount')).focus();
        return;
      }
      const params = new URLSearchParams({
        country: cselVal('country'),
        currency: cselVal('currency'),
        amount: amountVal,
      });
      if (cselVal('installments') === 'on') params.set('installments', 'on');
      params.set('shopperInteraction', cselVal('shopperInteraction'));
      const recurringModel = cselVal('recurringModel');
      if (recurringModel) params.set('recurringModel', recurringModel);
      const shopperRef = document.getElementById('shopperRef').value.trim();
      if (shopperRef) params.set('shopperRef', shopperRef);
      const ref = document.getElementById('merchantRef').value.trim();
      if (ref) params.set('merchantRef', ref);
      const phone = document.getElementById('telephoneNumber').value.trim();
      if (phone) params.set('telephoneNumber', phone);
      const email = document.getElementById('shopperEmail').value.trim();
      if (email) params.set('shopperEmail', email);
      if (billingReqEl.checked) {
        params.set('billingAddressRequired', 'true');
        params.set('billingAddressMode', cselVal('billingAddressMode'));
      }
      params.set('enableStoreDetails', document.getElementById('enableStoreDetails').checked ? 'true' : 'false');
      params.set('showStoredPaymentMethods', document.getElementById('showStoredPaymentMethods').checked ? 'true' : 'false');
      params.set('shopperLocale', cselVal('shopperLocale'));
      params.set('threeDSMode', cselVal('threeDSMode'));
      if (chargebackHolderName) params.set('chargebackHolderName', chargebackHolderName);
      window.location.href = '/checkout.html?' + params.toString();
    });

    // ── Responsive test-scenario panel ──────────────────────────────────
    const presetPanelEl = document.querySelector('.preset-panel');
    const presetMount = document.getElementById('presetMount');
    const presetDialog = document.getElementById('presetDialog');
    const presetBreakpoint = window.matchMedia('(max-width: 1180px)');
    function syncPresetPlacement() {
      if (presetBreakpoint.matches) {
        if (!presetDialog.contains(presetPanelEl)) presetDialog.append(presetPanelEl);
      } else if (!presetMount.contains(presetPanelEl)) {
        if (presetDialog.open) presetDialog.close();
        presetMount.append(presetPanelEl);
      }
    }
    syncPresetPlacement();
    presetBreakpoint.addEventListener('change', syncPresetPlacement);
    document.getElementById('openPresets').addEventListener('click', () => {
      syncPresetPlacement();
      if (!presetDialog.open) presetDialog.showModal();
    });
    document.getElementById('closePresets').addEventListener('click', () => presetDialog.close());
    presetDialog.addEventListener('click', (event) => {
      if (event.target === presetDialog) presetDialog.close();
    });

    // ── Test scenario presets ────────────────────────────────────────────
    const shopperRefEl = document.getElementById('shopperRef');
    const rememberNote = document.getElementById('rememberNote');
    const rememberRef = document.getElementById('rememberRef');
    const reuseNote = document.getElementById('reuseNote');
    const cbReminder = document.getElementById('cb-reminder');
    const cbChips = document.querySelectorAll('.cb-chip');
    let chargebackHolderName = '';

    let selectedCbChip = null;
    function clearChargeback() {
      chargebackHolderName = '';
      selectedCbChip = null;
      cbChips.forEach(c => c.classList.remove('selected'));
      cbReminder.classList.remove('show');
    }
    function renderCbReminder() {
      if (!selectedCbChip) return;
      const tpl = (window.t ? window.t('cb.reminder') : '');
      cbReminder.innerHTML = tpl
        .replace('{name}', selectedCbChip.dataset.cb)
        .replace('{scheme}', selectedCbChip.dataset.scheme);
      cbReminder.classList.add('show');
    }
    cbChips.forEach(chip => {
      chip.addEventListener('click', () => {
        cbChips.forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        chargebackHolderName = chip.dataset.cb;
        selectedCbChip = chip;
        renderCbReminder();
      });
    });

    function clearRememberNote() {
      shopperRefEl.classList.remove('field-highlight');
      rememberNote.classList.remove('show');
      reuseNote.classList.remove('show');
    }
    // Remove the highlight once the user edits the reference themselves.
    shopperRefEl.addEventListener('input', clearRememberNote);

    // 1. First-time card tokenization
    document.getElementById('preset-firstpay').addEventListener('click', () => {
      clearChargeback();
      const rand = 'user_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
      shopperRefEl.value = rand;
      cselSet('shopperInteraction', 'Ecommerce');
      cselSet('recurringModel', 'CardOnFile');
      document.getElementById('enableStoreDetails').checked = true;
      // Highlight so the tester remembers the generated reference.
      shopperRefEl.classList.add('field-highlight');
      reuseNote.classList.remove('show');
      rememberRef.textContent = rand;
      rememberNote.classList.add('show');
      shopperRefEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // 2. Pay with a stored card (reuse)
    document.getElementById('preset-reuse').addEventListener('click', () => {
      clearChargeback();
      shopperRefEl.value = '';
      cselSet('shopperInteraction', 'ContAuth');
      cselSet('recurringModel', 'CardOnFile');
      document.getElementById('showStoredPaymentMethods').checked = true;
      shopperRefEl.placeholder = window.t ? window.t('ph.reusePrev') : 'Enter the previous Shopper Reference';
      // Highlighted prompt below the field asking for the previous reference.
      rememberNote.classList.remove('show');
      shopperRefEl.classList.add('field-highlight');
      reuseNote.classList.add('show');
      shopperRefEl.focus();
      shopperRefEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // 4. Test credit card installments (Brazil)
    document.getElementById('preset-installments').addEventListener('click', () => {
      clearChargeback();
      clearRememberNote();
      cselSet('country', 'BR');
      cselSet('currency', 'BRL');
      document.getElementById('amount').value = '100';
      updateInstallmentsAvailability();
      cselSet('installments', 'on');
    });

    // Restore to default
    document.getElementById('preset-reset').addEventListener('click', () => {
      clearRememberNote();
      clearChargeback();
      cselSet('country', 'SG');
      cselSet('shopperLocale', 'en-US');
      cselSet('currency', 'SGD');
      cselSet('shopperInteraction', 'Ecommerce');
      cselSet('recurringModel', '');
      cselSet('threeDSMode', 'native');
      cselSet('installments', 'off');
      updateInstallmentsAvailability();
      cselSet('billingAddressMode', 'full');
      document.getElementById('amount').value = '10';
      shopperRefEl.value = '';
      shopperRefEl.placeholder = window.t ? window.t('ph.optional') : 'optional';
      document.getElementById('merchantRef').value = '';
      document.getElementById('telephoneNumber').value = '1234567890';
      document.getElementById('shopperEmail').value = 'test@example.com';
      document.getElementById('billingAddressRequired').checked = false;
      billingModeCsel.classList.add('csel--disabled');
      document.getElementById('enableStoreDetails').checked = true;
      document.getElementById('showStoredPaymentMethods').checked = true;
      document.getElementById('amountError').style.display = 'none';
      document.getElementById('emailError').style.display = 'none';
    });

    // ── Language toggle ──────────────────────────────────────────────────
    if (window.initLangSwitch) initLangSwitch('#langSwitch');
    document.addEventListener('langchange', renderCbReminder);
  </script>
</body>
</html>
