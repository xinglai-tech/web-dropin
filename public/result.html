<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Result</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="header">
    <h1>Payment Result</h1>
    <p>See the outcome of your payment below</p>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="spinner active" id="spinner"></div>
  </div>

  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const redirectResult = params.get('redirectResult');
      const resultCode     = params.get('resultCode');

      const card    = document.getElementById('resultCard');
      const spinner = document.getElementById('spinner');

      let webhookStatusUrl = '';
      try {
        const cfg = await (await fetch('/api/config')).json();
        webhookStatusUrl = cfg.webhookStatusUrl || '';
      } catch (e) { /* config optional */ }

      // ── If we already have a resultCode (from onPaymentCompleted) ──────
      if (resultCode && !redirectResult) {
        spinner.classList.remove('active');
        renderResult({ resultCode });
        return;
      }

      // ── If we have a redirectResult, call /payments/details ────────────
      if (redirectResult) {
        try {
          const res = await fetch('/api/payments/details', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              details: { redirectResult },
            }),
          });
          const data = await res.json();
          spinner.classList.remove('active');
          renderResult(data);
        } catch (err) {
          spinner.classList.remove('active');
          renderResult({ resultCode: 'Error', error: err.message });
        }
        return;
      }

      // ── No data at all ────────────────────────────────────────────────
      spinner.classList.remove('active');
      renderResult({ resultCode: 'Unknown' });

      // ── Render helper ──────────────────────────────────────────────────
      function renderResult(data) {
        const code = data.resultCode || 'Unknown';
        const icon = {
          Authorised: '✓', Received: '⏳', Pending: '⏳',
          Refused: '✕', Cancelled: '⊘', Error: '!',
        }[code] || 'ℹ';

        const subtitle = {
          Authorised: 'Your payment was successful.',
          Received: 'Your payment has been received and is being processed.',
          Pending: 'Your payment is pending confirmation.',
          Refused: 'Your payment was refused. Please try another method.',
          Cancelled: 'The payment was cancelled.',
          Error: 'Something went wrong while processing your payment.',
        }[code] || 'We could not determine the payment status.';

        const tone = code === 'Authorised'
          ? { badge: 'success', status: 'status-authorised' }
          : ['Refused', 'Cancelled', 'Error'].includes(code)
            ? { badge: 'refused', status: 'status-refused' }
            : ['Received', 'Pending'].includes(code)
              ? { badge: 'pending', status: 'status-pending' }
              : { badge: 'info', status: 'status-info' };

        let html = `
          <div class="result-badge ${tone.badge} ${tone.status}">${icon}</div>
          <h2 class="${tone.status}">${code}</h2>
          <p class="result-sub">${subtitle}</p>
        `;

        // Show available detail fields
        const fields = [
          ['PSP Reference',  data.pspReference],
          ['Merchant Reference', data.merchantReference],
          ['Result Code',    data.resultCode],
          ['Refusal Reason', data.refusalReason],
          ['Error', data.error],
        ];
        const rows = fields
          .filter(([, value]) => value)
          .map(([label, value]) => `
              <div class="detail-row">
                <span>${label}</span><span>${value}</span>
              </div>`)
          .join('');
        if (rows) {
          html += `<div class="result-details">${rows}</div>`;
        }

        html += `<a class="back-link" href="/">Start a new payment</a>`;
        if (webhookStatusUrl) {
          html += `<a class="webhook-link" href="${webhookStatusUrl}" target="_blank" rel="noopener noreferrer">View transaction status in webhook</a>`;
        }
        card.innerHTML = html;
      }
    })();
  </script>
</body>
</html>
