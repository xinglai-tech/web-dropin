<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyen Checkout</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet"
        href="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/6.33.0/adyen.css" />
  <style>
    .adyen-checkout__store-details {
      background: #f5f7fa !important;
      border: none !important;
      border-radius: 8px;
      padding: 12px !important;
    }

    /* ── Test cards side panel ─────────────────────────────────────────── */
    .test-cards-panel {
      display: none;
      position: absolute;
      left: 24px;
      width: 300px;
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 20px;
      z-index: 100;
    }
    .test-cards-panel.visible {
      display: block;
    }
    .test-cards-panel h3 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #333;
    }
    .tc-hint {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 14px;
    }
    .tc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 8px;
    }
    .tc-row:last-child {
      border-bottom: none;
    }
    .tc-info {
      display: flex;
      flex-direction: column;
    }
    .tc-group-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #4A8DAB;
      margin: 14px 0 4px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid #eef2f5;
    }
    .tc-group-title:first-child {
      margin-top: 0;
    }
    .tc-logo {
      height: 18px;
      width: auto;
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
    }
    .tc-logo-emoji {
      font-size: 14px;
      line-height: 1;
    }
    .tc-brand {
      font-size: 0.72rem;
      color: #888;
      font-weight: 600;
    }
    .tc-meta {
      font-size: 0.68rem;
      color: #e67e22;
      font-weight: 600;
      margin-top: 2px;
    }
    .tc-number {
      font-size: 0.9rem;
      font-family: 'SFMono-Regular', Consolas, monospace;
      color: #1a1a2e;
      letter-spacing: 0.02em;
    }
    .tc-copy {
      border: none;
      background: #eef2f5;
      color: #4A8DAB;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .tc-copy:hover {
      background: #dce6ec;
    }
    .tc-copy.copied {
      background: #4A8DAB;
      color: #fff;
    }
    .tc-note-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #4A8DAB;
      margin: 18px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid #eef2f5;
    }
    .tc-note {
      font-size: 0.8rem;
      color: #555;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .tc-note.warn {
      color: #c0392b;
    }
    .tc-note.bullet {
      position: relative;
      padding-left: 16px;
      margin-bottom: 4px;
    }
    .tc-note.bullet::before {
      content: '•';
      position: absolute;
      left: 3px;
      color: #4A8DAB;
    }
    .tc-note a {
      color: #4A8DAB;
      word-break: break-all;
    }
    .tc-note a:hover {
      color: #3D7D99;
    }
    @media (max-width: 1100px) {
      .test-cards-panel.visible {
        display: none;
      }
    }

    /* ── API debug panel ───────────────────────────────────────────────── */
    .debug-toggles {
      display: none;
      gap: 8px;
      margin-top: 16px;
    }
    .debug-toggle {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      white-space: nowrap;
      background: #fff;
      color: #4A8DAB;
      border: 1.5px solid #d8e5ec;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: clamp(0.78rem, 2.6vw, 0.9rem);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .debug-toggle:hover {
      background: #f5f9fb;
      color: #3D7D99;
      border-color: #cfe0e9;
    }
    .debug-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 440px;
      max-width: 90vw;
      height: 100vh;
      background: #fff;
      color: #1a1a2e;
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.1);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 205;
      display: flex;
      flex-direction: column;
    }
    .debug-panel.open {
      transform: translateX(0);
    }
    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: linear-gradient(135deg, #4A8DAB 0%, #4A8DAB 100%);
      flex-shrink: 0;
    }
    .debug-header h3 {
      font-size: 1rem;
      color: #fff;
    }
    .debug-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
      transition: background 0.15s;
    }
    .debug-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .debug-toolbar {
      padding: 10px 18px;
      background: #eef4f8;
      border-bottom: 1px solid #dce6ec;
      flex-shrink: 0;
    }
    .debug-freeze-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #33556a;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    .debug-freeze-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      flex: 0 0 16px;
      accent-color: #4A8DAB;
      cursor: pointer;
    }
    .debug-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 18px;
      background: #f5f7fa;
    }
    .debug-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: #fff7ed;
      border-top: 1.5px solid #fed7aa;
      flex-shrink: 0;
      font-size: 0.85rem;
      color: #9a3412;
    }
    .debug-proceed {
      background: #4A8DAB;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .debug-proceed:hover {
      background: #3D7D99;
    }
    .debug-empty {
      color: #888;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .debug-entry {
      margin-bottom: 16px;
    }
    .debug-entry-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid #e3e8ee;
    }
    .debug-entry-title .method {
      color: #4A8DAB;
    }
    .debug-entry-title.req .label {
      color: #d97706;
    }
    .debug-entry-title.res .label {
      color: #2e9d63;
    }
    .debug-copy {
      background: #eef2f5;
      color: #4A8DAB;
      border: none;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .debug-copy:hover {
      background: #dce6ec;
    }
    .debug-copy.copied {
      background: #4A8DAB;
      color: #fff;
    }
    .debug-json {
      background: #fff;
      border: 1px solid #e3e8ee;
      border-radius: 8px;
      padding: 12px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.5;
      color: #1a1a2e;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      margin: 0;
    }
  </style>
  <script src="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/6.33.0/adyen.js"></script>
</head>
<body>
  <div class="header">
    <h1>Checkout</h1>
    <p id="summary"></p>
  </div>

  <div class="card">
    <div class="spinner active" id="spinner"></div>
    <div id="error-banner" style="display:none;background:#fdecea;color:#c0392b;padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:0.9rem;word-break:break-all;"></div>
    <div id="dropin-container" style="display:none;"></div>
    <div id="psp-info" style="display:none;background:#eef7ee;padding:12px 16px;border-radius:8px;margin-top:12px;font-size:0.9rem;text-align:center;color:#333;word-break:break-all;"></div>
    <div class="debug-toggles">
      <button id="event-toggle" class="debug-toggle event" type="button">SDK Event</button>
      <button id="debug-toggle" class="debug-toggle" type="button">API Log</button>
    </div>
    <div style="text-align:center;margin-top:16px;">
      <a href="/" style="color:#4A8DAB;font-size:0.9rem;text-decoration:none;font-weight:500;">← Back to Home</a>
    </div>
  </div>

  <aside id="test-cards-panel" class="test-cards-panel">
    <h3>Test Cards</h3>
    <p class="tc-hint">Expiry <b>03/30</b> &middot; CVC <b>737</b> (Amex <b>7373</b>)</p>
    <div class="tc-list"></div>
  </aside>

  <aside id="debug-panel" class="debug-panel">
    <div class="debug-header">
      <h3>Backend API</h3>
      <div>
        <button id="debug-clear" class="debug-btn" type="button">Clear</button>
        <button id="debug-close" class="debug-btn" type="button">✕</button>
      </div>
    </div>
    <div class="debug-toolbar">
      <label class="debug-freeze-label">
        <input type="checkbox" id="freeze-redirect" />
        <span>Freeze redirect (pause before leaving page)</span>
      </label>
    </div>
    <div class="debug-body" id="debug-body">
      <p class="debug-empty">No API calls yet. Interact with the payment form to see requests and responses.</p>
    </div>
    <div class="debug-footer" id="debug-footer" style="display:none;">
      <span>⏸ Redirect paused — review the log above.</span>
      <button id="debug-proceed" class="debug-proceed" type="button">Proceed →</button>
    </div>
  </aside>

  <aside id="event-panel" class="debug-panel">
    <div class="debug-header">
      <h3>SDK Events</h3>
      <div>
        <button id="event-clear" class="debug-btn" type="button">Clear</button>
        <button id="event-close" class="debug-btn" type="button">✕</button>
      </div>
    </div>
    <div class="debug-body" id="event-body">
      <p class="debug-empty">No SDK events yet. Interact with the payment form to see events.</p>
    </div>
  </aside>

  <script>
    // ── API debug panel ──────────────────────────────────────────────────
    const debugPanel = document.getElementById('debug-panel');
    const debugBody = document.getElementById('debug-body');
    const debugToggle = document.getElementById('debug-toggle');
    const debugToggles = document.querySelector('.debug-toggles');
    const freezeChk = document.getElementById('freeze-redirect');
    const debugFooter = document.getElementById('debug-footer');
    const debugProceed = document.getElementById('debug-proceed');
    const mainHeader = document.querySelector('.header');
    const debugHeaderEl = debugPanel.querySelector('.debug-header');
    function syncDebugHeader() {
      debugHeaderEl.style.height = mainHeader.offsetHeight + 'px';
    }
    syncDebugHeader();
    window.addEventListener('resize', syncDebugHeader);

    debugToggle.addEventListener('click', () => {
      if (debugPanel.classList.contains('open')) {
        debugPanel.classList.remove('open');
        return;
      }
      syncDebugHeader();
      eventPanel.classList.remove('open');
      debugPanel.classList.add('open');
    });
    document.getElementById('debug-close').addEventListener('click', () => {
      debugPanel.classList.remove('open');
    });
    document.getElementById('debug-clear').addEventListener('click', () => {
      debugBody.innerHTML =
        '<p class="debug-empty">No API calls yet. Interact with the payment form to see requests and responses.</p>';
    });

    function logApi(endpoint, kind, data) {
      const empty = debugBody.querySelector('.debug-empty');
      if (empty) empty.remove();

      const json = typeof data === 'string' ? data : JSON.stringify(data, null, 2);

      const entry = document.createElement('div');
      entry.className = 'debug-entry';

      const title = document.createElement('div');
      title.className = 'debug-entry-title ' + (kind === 'Request' ? 'req' : 'res');
      const left = document.createElement('span');
      left.innerHTML =
        '<span class="method">' + endpoint + '</span> &middot; ' +
        '<span class="label">' + kind + '</span>';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'debug-copy';
      copyBtn.type = 'button';
      copyBtn.textContent = 'Copy';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(json);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = json;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1200);
      });
      title.appendChild(left);
      title.appendChild(copyBtn);

      const pre = document.createElement('pre');
      pre.className = 'debug-json';
      pre.textContent = json;

      entry.appendChild(title);
      entry.appendChild(pre);
      debugBody.appendChild(entry);
      debugBody.scrollTop = debugBody.scrollHeight;
    }

    // Pause a redirect so the log can be inspected; resume on Proceed click.
    function freezeRedirect(proceedFn) {
      eventPanel.classList.remove('open');
      debugPanel.classList.add('open');
      debugFooter.style.display = 'flex';
      debugProceed.onclick = () => {
        debugFooter.style.display = 'none';
        proceedFn();
      };
    }

    // ── SDK Event panel ───────────────────────────────────────────────────
    const eventPanel = document.getElementById('event-panel');
    const eventBody = document.getElementById('event-body');
    const eventToggle = document.getElementById('event-toggle');
    const eventHeaderEl = eventPanel.querySelector('.debug-header');
    function syncEventHeader() {
      eventHeaderEl.style.height = mainHeader.offsetHeight + 'px';
    }
    syncEventHeader();
    window.addEventListener('resize', syncEventHeader);

    eventToggle.addEventListener('click', () => {
      if (eventPanel.classList.contains('open')) {
        eventPanel.classList.remove('open');
        return;
      }
      syncEventHeader();
      debugPanel.classList.remove('open');
      eventPanel.classList.add('open');
    });
    document.getElementById('event-close').addEventListener('click', () => {
      eventPanel.classList.remove('open');
    });
    document.getElementById('event-clear').addEventListener('click', () => {
      eventBody.innerHTML =
        '<p class="debug-empty">No SDK events yet. Interact with the payment form to see events.</p>';
    });

    function safeStringify(obj) {
      const seen = new WeakSet();
      try {
        return JSON.stringify(obj, (k, v) => {
          if (v instanceof Node) return '[DOM ' + v.nodeName + ']';
          if (typeof Window !== 'undefined' && v instanceof Window) return '[Window]';
          if (typeof v === 'function') return '[fn]';
          if (typeof v === 'object' && v !== null) {
            if (seen.has(v)) return '[circular]';
            seen.add(v);
          }
          return v;
        }, 2);
      } catch (e) {
        return String(obj);
      }
    }

    function logEvent(name, data) {
      const empty = eventBody.querySelector('.debug-empty');
      if (empty) empty.remove();

      const json = data === undefined ? '(no payload)' : safeStringify(data);
      const time = new Date().toLocaleTimeString();

      const entry = document.createElement('div');
      entry.className = 'debug-entry';

      const title = document.createElement('div');
      title.className = 'debug-entry-title res';
      const left = document.createElement('span');
      left.innerHTML =
        '<span class="method">' + name + '</span> &middot; ' +
        '<span class="label" style="color:#7b61a8;">' + time + '</span>';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'debug-copy';
      copyBtn.type = 'button';
      copyBtn.textContent = 'Copy';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(json);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = json;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1200);
      });
      title.appendChild(left);
      title.appendChild(copyBtn);

      const pre = document.createElement('pre');
      pre.className = 'debug-json';
      pre.textContent = json;

      entry.appendChild(title);
      entry.appendChild(pre);
      eventBody.appendChild(entry);
      eventBody.scrollTop = eventBody.scrollHeight;
    }

    (async () => {
      const { AdyenCheckout, Dropin } = window.AdyenWeb;
      let lastPspReference = '';
      // ── Read query params ───────────────────────────────────────────────
      const params  = new URLSearchParams(window.location.search);
      const country  = params.get('country')  || 'SG';
      const currency = params.get('currency') || 'SGD';
      const amountMajor = parseFloat(params.get('amount') || '10');
      const channel  = params.get('channel')  || 'Web';
      const merchantRef = params.get('merchantRef') || '';
      const shopperRef = params.get('shopperRef') || 'user_shanghai';
      const shopperInteraction = params.get('shopperInteraction') || 'Ecommerce';
      const recurringModel = params.get('recurringModel') || '';
      const billingAddressRequired = params.get('billingAddressRequired') === 'true';
      const billingAddressMode = params.get('billingAddressMode') || 'full';
      const enableStoreDetails = params.get('enableStoreDetails') !== 'false';
      const showStoredPaymentMethods = params.get('showStoredPaymentMethods') !== 'false';
      const showPayButton = params.get('showPayButton') !== 'false';
      const threeDSMode = params.get('threeDSMode') || 'native';

      // ── Convert major units to minor units ────────────────────────────
      const zeroDecimalCurrencies = ['JPY', 'KRW', 'VND', 'CLP', 'PYG', 'GNF', 'RWF', 'UGX', 'XOF', 'XAF', 'ISK', 'HUF'];
      const threeDecimalCurrencies = ['BHD', 'JOD', 'KWD', 'OMR', 'TND'];
      let amount;
      if (zeroDecimalCurrencies.includes(currency)) {
        amount = Math.round(amountMajor);
      } else if (threeDecimalCurrencies.includes(currency)) {
        amount = Math.round(amountMajor * 1000);
      } else {
        amount = Math.round(amountMajor * 100);
      }

      document.getElementById('summary').textContent =
        `${currency} ${amountMajor} — ${country} — ${channel}`;

      // ── Fetch config & payment methods in parallel ────────────────────
      const pmRequestBody = { countryCode: country, currency, amount, channel, shopperRef };
      logApi('/paymentMethods', 'Request', pmRequestBody);
      const [configRes, pmRes] = await Promise.all([
        fetch('/api/config'),
        fetch('/api/paymentMethods', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pmRequestBody),
        }),
      ]);
      const { clientKey, environment } = await configRes.json();
      const paymentMethodsResponse = await pmRes.json();
      logApi('/paymentMethods', 'Response', paymentMethodsResponse);
      if (!showStoredPaymentMethods) delete paymentMethodsResponse.storedPaymentMethods;

      // ── Build return URL for redirect payments ──────────────────────────
      const returnUrl = `${window.location.origin}/result.html`;

      // ── Initialise Adyen Checkout (Advanced Flow) ───────────────────────
      const adyenCheckout = await AdyenCheckout({
        environment,
        clientKey,
        paymentMethodsResponse,
        countryCode: country,
        locale: 'en-US',
        amount: { currency, value: amount },
        enableStoreDetails,

        onChange: (state, component) => {
          logEvent('onChange', { paymentMethod: component?.props?.type, isValid: state.isValid, data: state.data });
        },

        // Called when the shopper submits payment
        onSubmit: async (state, component, actions) => {
          logEvent('onSubmit', { paymentMethod: component?.props?.type, isValid: state.isValid });
          try {
            const paymentsRequestBody = {
              ...state.data,
              currency,
              amount,
              countryCode: country,
              channel,
              returnUrl,
              shopperRef,
              shopperInteraction,
              threeDSMode,
              ...(recurringModel && { recurringModel }),
              ...(merchantRef && { merchantRef }),
            };
            logApi('/payments', 'Request', paymentsRequestBody);
            const res = await fetch('/api/payments', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(paymentsRequestBody),
            });
            const result = await res.json();
            logApi('/payments', 'Response', result);

            if (result.error) {
              showError(result.error);
              actions.reject();
              return;
            }
            if (result.pspReference) lastPspReference = result.pspReference;

            if (freezeChk.checked && result.action && result.action.type === 'redirect') {
              freezeRedirect(() => actions.resolve(result));
              return;
            }
            actions.resolve(result);
          } catch (err) {
            console.error('onSubmit error:', err);
            showError(err.message || 'Payment request failed');
            actions.reject();
          }
        },

        // Called after additional shopper interaction (e.g. native 3DS)
        onAdditionalDetails: async (state, component, actions) => {
          logEvent('onAdditionalDetails', state.data);
          try {
            const detailsRequestBody = { details: state.data.details };
            logApi('/payments/details', 'Request', detailsRequestBody);
            const res = await fetch('/api/payments/details', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(detailsRequestBody),
            });
            const result = await res.json();
            logApi('/payments/details', 'Response', result);

            if (result.error) {
              showError(result.error);
              actions.reject();
              return;
            }
            if (result.pspReference) lastPspReference = result.pspReference;
            actions.resolve(result);
          } catch (err) {
            console.error('onAdditionalDetails error:', err);
            showError(err.message || 'Details request failed');
            actions.reject();
          }
        },

        onPaymentCompleted: (result, _component) => {
          logEvent('onPaymentCompleted', result);
          console.log('Payment completed:', result.resultCode);
          showPsp(lastPspReference);
        },

        onPaymentFailed: (result, _component) => {
          logEvent('onPaymentFailed', result);
          console.log('Payment failed:', result?.resultCode);
          showPsp(lastPspReference);
        },

        onError: (error, _component) => {
          logEvent('onError', { name: error?.name, message: error?.message });
          console.error('Checkout error:', error);
          const msg = error.message || JSON.stringify(error);
          if (/applepay|apple pay/i.test(msg)) return;
          showError(msg);

        function appendRichText(el, text) {
          const boldRe = /\*\*(.+?)\*\*/g;
          let last = 0;
          let m;
          while ((m = boldRe.exec(text)) !== null) {
            if (m.index > last) appendLinkified(el, text.slice(last, m.index));
            const b = document.createElement('b');
            appendLinkified(b, m[1]);
            el.appendChild(b);
            last = m.index + m[0].length;
          }
          if (last < text.length) appendLinkified(el, text.slice(last));
        }

        function appendLinkified(el, text) {
          const re = /(https?:\/\/[^\s]+)/g;
          let last = 0;
          let m;
          while ((m = re.exec(text)) !== null) {
            if (m.index > last) {
              el.appendChild(document.createTextNode(text.slice(last, m.index)));
            }
            let url = m[0];
            let trailing = '';
            const tm = url.match(/[).,;:]+$/);
            if (tm) {
              trailing = tm[0];
              url = url.slice(0, url.length - trailing.length);
            }
            const a = document.createElement('a');
            a.href = url;
            a.textContent = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            el.appendChild(a);
            if (trailing) el.appendChild(document.createTextNode(trailing));
            last = m.index + m[0].length;
          }
          if (last < text.length) {
            el.appendChild(document.createTextNode(text.slice(last)));
          }
        }

          const type = getSelectedType();
          const isCard = type === 'scheme';

          const show = isCard || !!cred;
          panel.classList.toggle('visible', show);
          if (!show) {

            return;

          const key = isCard ? 'scheme' : type;
          if (renderedKey !== key) {

            else renderLpm(cred);
            renderedKey = key;
          }
          alignPanel();
        };
        refreshCredPanel = update;

        const container = document.getElementById('dropin-container');
        new MutationObserver(update).observe(container, {
          subtree: true,
          childList: true,
          attributes: true,

        });

          if (panel.classList.contains('visible')) alignPanel();
        }).observe(card);
        window.addEventListener('resize', () => {
          if (panel.classList.contains('visible')) alignPanel();
        });
        update();

      function showPsp(psp) {
        if (!psp) return;
        const el = document.getElementById('psp-info');
