<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyen Checkout</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet"
        href="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/6.33.0/adyen.css" />
  <style>
    .adyen-checkout__store-details {
      background: #f5f7fa !important;
      border: none !important;
      border-radius: 8px;
      padding: 12px !important;
    }

    /* ── Test cards side panel ─────────────────────────────────────────── */
    .test-cards-panel {
      display: none;
      position: absolute;
      left: 24px;
      width: 300px;
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 20px;
      z-index: 100;
    }
    .test-cards-panel.visible {
      display: block;
    }
    .test-cards-panel h3 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #333;
    }
    .tc-hint {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 14px;
    }
    .tc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 8px;
    }
    .tc-row:last-child {
      border-bottom: none;
    }
    .tc-info {
      display: flex;
      flex-direction: column;
    }
    .tc-group-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #4A8DAB;
      margin: 14px 0 4px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid #eef2f5;
    }
    .tc-group-title:first-child {
      margin-top: 0;
    }
    .tc-logo {
      height: 18px;
      width: auto;
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
    }
    .tc-logo-emoji {
      font-size: 14px;
      line-height: 1;
    }
    .tc-brand {
      font-size: 0.72rem;
      color: #888;
      font-weight: 600;
    }
    .tc-meta {
      font-size: 0.68rem;
      color: #e67e22;
      font-weight: 600;
      margin-top: 2px;
    }
    .tc-number {
      font-size: 0.9rem;
      font-family: 'SFMono-Regular', Consolas, monospace;
      color: #1a1a2e;
      letter-spacing: 0.02em;
    }
    .tc-copy {
      border: none;
      background: #eef2f5;
      color: #4A8DAB;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .tc-copy:hover {
      background: #dce6ec;
    }
    .tc-copy.copied {
      background: #4A8DAB;
      color: #fff;
    }
    @media (max-width: 1100px) {
      .test-cards-panel.visible {
        display: none;
      }
    }

    /* ── API debug panel ───────────────────────────────────────────────── */
    .debug-toggle {
      position: fixed;
      top: 18px;
      right: 16px;
      z-index: 210;
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .debug-toggle:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .debug-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 440px;
      max-width: 90vw;
      height: 100vh;
      background: #fff;
      color: #1a1a2e;
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.1);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 205;
      display: flex;
      flex-direction: column;
    }
    .debug-panel.open {
      transform: translateX(0);
    }
    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: linear-gradient(135deg, #4A8DAB 0%, #4A8DAB 100%);
      flex-shrink: 0;
    }
    .debug-header h3 {
      font-size: 1rem;
      color: #fff;
    }
    .debug-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      margin-left: 6px;
      transition: background 0.15s;
    }
    .debug-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .debug-toolbar {
      padding: 10px 18px;
      background: #eef4f8;
      border-bottom: 1px solid #dce6ec;
      flex-shrink: 0;
    }
    .debug-freeze-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #33556a;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    .debug-freeze-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      flex: 0 0 16px;
      accent-color: #4A8DAB;
      cursor: pointer;
    }
    .debug-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 18px;
      background: #f5f7fa;
    }
    .debug-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: #fff7ed;
      border-top: 1.5px solid #fed7aa;
      flex-shrink: 0;
      font-size: 0.85rem;
      color: #9a3412;
    }
    .debug-proceed {
      background: #4A8DAB;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .debug-proceed:hover {
      background: #3D7D99;
    }
    .debug-empty {
      color: #888;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .debug-entry {
      margin-bottom: 16px;
    }
    .debug-entry-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid #e3e8ee;
    }
    .debug-entry-title .method {
      color: #4A8DAB;
    }
    .debug-entry-title.req .label {
      color: #d97706;
    }
    .debug-entry-title.res .label {
      color: #2e9d63;
    }
    .debug-copy {
      background: #eef2f5;
      color: #4A8DAB;
      border: none;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .debug-copy:hover {
      background: #dce6ec;
    }
    .debug-copy.copied {
      background: #4A8DAB;
      color: #fff;
    }
    .debug-json {
      background: #fff;
      border: 1px solid #e3e8ee;
      border-radius: 8px;
      padding: 12px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.5;
      color: #1a1a2e;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      margin: 0;
    }
  </style>
  <script src="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/6.33.0/adyen.js"></script>
</head>
<body>
  <div class="header">
    <h1>Checkout</h1>
    <p id="summary"></p>
  </div>

  <div class="card">
    <div class="spinner active" id="spinner"></div>
    <div id="error-banner" style="display:none;background:#fdecea;color:#c0392b;padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:0.9rem;word-break:break-all;"></div>
    <div id="dropin-container" style="display:none;"></div>
    <div id="psp-info" style="display:none;background:#eef7ee;padding:12px 16px;border-radius:8px;margin-top:12px;font-size:0.9rem;text-align:center;color:#333;word-break:break-all;"></div>
    <div style="text-align:center;margin-top:16px;">
      <a href="/" style="color:#4A8DAB;font-size:0.9rem;text-decoration:none;font-weight:500;">← Back to Home</a>
    </div>
  </div>

  <aside id="test-cards-panel" class="test-cards-panel">
    <h3>Test Cards</h3>
    <p class="tc-hint">Expiry <b>03/30</b> &middot; CVC <b>737</b> (Amex <b>7373</b>)</p>
    <div class="tc-list"></div>
  </aside>

  <button id="debug-toggle" class="debug-toggle" type="button">API Log</button>
  <aside id="debug-panel" class="debug-panel">
    <div class="debug-header">
      <h3>Backend API</h3>
      <div>
        <button id="debug-clear" class="debug-btn" type="button">Clear</button>
        <button id="debug-close" class="debug-btn" type="button">✕</button>
      </div>
    </div>
    <div class="debug-toolbar">
      <label class="debug-freeze-label">
        <input type="checkbox" id="freeze-redirect" />
        <span>Freeze redirect (pause before leaving page)</span>
      </label>
    </div>
    <div class="debug-body" id="debug-body">
      <p class="debug-empty">No API calls yet. Interact with the payment form to see requests and responses.</p>
    </div>
    <div class="debug-footer" id="debug-footer" style="display:none;">
      <span>⏸ Redirect paused — review the log above.</span>
      <button id="debug-proceed" class="debug-proceed" type="button">Proceed →</button>
    </div>
  </aside>

  <script>
    // ── API debug panel ──────────────────────────────────────────────────
    const debugPanel = document.getElementById('debug-panel');
    const debugBody = document.getElementById('debug-body');
    const debugToggle = document.getElementById('debug-toggle');
    const freezeChk = document.getElementById('freeze-redirect');
    const debugFooter = document.getElementById('debug-footer');
    const debugProceed = document.getElementById('debug-proceed');
    const mainHeader = document.querySelector('.header');
    const debugHeaderEl = debugPanel.querySelector('.debug-header');
    function syncDebugHeader() {
      debugHeaderEl.style.height = mainHeader.offsetHeight + 'px';
    }
    syncDebugHeader();
    window.addEventListener('resize', syncDebugHeader);

    debugToggle.addEventListener('click', () => {
      syncDebugHeader();
      debugPanel.classList.add('open');
      debugToggle.style.display = 'none';
    });
    document.getElementById('debug-close').addEventListener('click', () => {
      debugPanel.classList.remove('open');
      debugToggle.style.display = '';
    });
    document.getElementById('debug-clear').addEventListener('click', () => {
      debugBody.innerHTML =
        '<p class="debug-empty">No API calls yet. Interact with the payment form to see requests and responses.</p>';
    });

    function logApi(endpoint, kind, data) {
      const empty = debugBody.querySelector('.debug-empty');
      if (empty) empty.remove();

      const json = typeof data === 'string' ? data : JSON.stringify(data, null, 2);

      const entry = document.createElement('div');
      entry.className = 'debug-entry';

      const title = document.createElement('div');
      title.className = 'debug-entry-title ' + (kind === 'Request' ? 'req' : 'res');
      const left = document.createElement('span');
      left.innerHTML =
        '<span class="method">' + endpoint + '</span> &middot; ' +
        '<span class="label">' + kind + '</span>';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'debug-copy';
      copyBtn.type = 'button';
      copyBtn.textContent = 'Copy';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(json);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = json;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1200);
      });
      title.appendChild(left);
      title.appendChild(copyBtn);

      const pre = document.createElement('pre');
      pre.className = 'debug-json';
      pre.textContent = json;

      entry.appendChild(title);
      entry.appendChild(pre);
      debugBody.appendChild(entry);
      debugBody.scrollTop = debugBody.scrollHeight;
    }

    // Pause a redirect so the log can be inspected; resume on Proceed click.
    function freezeRedirect(proceedFn) {
      debugPanel.classList.add('open');
      debugToggle.style.display = 'none';
      debugFooter.style.display = 'flex';
      debugProceed.onclick = () => {
        debugFooter.style.display = 'none';
        proceedFn();
      };
    }

    (async () => {
      const { AdyenCheckout, Dropin } = window.AdyenWeb;
      let lastPspReference = '';
      // ── Read query params ───────────────────────────────────────────────
      const params  = new URLSearchParams(window.location.search);
      const country  = params.get('country')  || 'SG';
      const currency = params.get('currency') || 'SGD';
      const amountMajor = parseFloat(params.get('amount') || '10');
      const channel  = params.get('channel')  || 'Web';
      const merchantRef = params.get('merchantRef') || '';
      const shopperRef = params.get('shopperRef') || 'user_shanghai';
      const shopperInteraction = params.get('shopperInteraction') || 'Ecommerce';
      const recurringModel = params.get('recurringModel') || '';
      const billingAddressRequired = params.get('billingAddressRequired') === 'true';
      const billingAddressMode = params.get('billingAddressMode') || 'full';

      // ── Convert major units to minor units ────────────────────────────
      const zeroDecimalCurrencies = ['JPY', 'KRW', 'VND', 'CLP', 'PYG', 'GNF', 'RWF', 'UGX', 'XOF', 'XAF', 'ISK', 'HUF'];
      const threeDecimalCurrencies = ['BHD', 'JOD', 'KWD', 'OMR', 'TND'];
      let amount;
      if (zeroDecimalCurrencies.includes(currency)) {
        amount = Math.round(amountMajor);
      } else if (threeDecimalCurrencies.includes(currency)) {
        amount = Math.round(amountMajor * 1000);
      } else {
        amount = Math.round(amountMajor * 100);
      }

      document.getElementById('summary').textContent =
        `${currency} ${amountMajor} — ${country} — ${channel}`;

      // ── Fetch config & payment methods in parallel ────────────────────
      const pmRequestBody = { countryCode: country, currency, amount, channel, shopperRef };
      logApi('/paymentMethods', 'Request', pmRequestBody);
      const [configRes, pmRes] = await Promise.all([
        fetch('/api/config'),
        fetch('/api/paymentMethods', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pmRequestBody),
        }),
      ]);
      const { clientKey, environment } = await configRes.json();
      const paymentMethodsResponse = await pmRes.json();
      logApi('/paymentMethods', 'Response', paymentMethodsResponse);
      if (!recurringModel) delete paymentMethodsResponse.storedPaymentMethods;

      // ── Build return URL for redirect payments ──────────────────────────
      const returnUrl = `${window.location.origin}/result.html`;

      // ── Initialise Adyen Checkout (Advanced Flow) ───────────────────────
      const adyenCheckout = await AdyenCheckout({
        environment,
        clientKey,
        paymentMethodsResponse,
        countryCode: country,
        locale: 'en-US',
        amount: { currency, value: amount },
        enableStoreDetails: true,

        // Called when the shopper submits payment
        onSubmit: async (state, component, actions) => {
          try {
            const paymentsRequestBody = {
              ...state.data,
              currency,
              amount,
              countryCode: country,
              channel,
              returnUrl,
              shopperRef,
              shopperInteraction,
              ...(recurringModel && { recurringModel }),
              ...(merchantRef && { merchantRef }),
            };
            logApi('/payments', 'Request', paymentsRequestBody);
            const res = await fetch('/api/payments', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(paymentsRequestBody),
            });
            const result = await res.json();
            logApi('/payments', 'Response', result);

            if (result.error) {
              showError(result.error);
              actions.reject();
              return;
            }
            if (result.pspReference) lastPspReference = result.pspReference;

            if (freezeChk.checked && result.action && result.action.type === 'redirect') {
              freezeRedirect(() => actions.resolve(result));
              return;
            }
            actions.resolve(result);
          } catch (err) {
            console.error('onSubmit error:', err);
            showError(err.message || 'Payment request failed');
            actions.reject();
          }
        },

        // Called after additional shopper interaction (e.g. native 3DS)
        onAdditionalDetails: async (state, component, actions) => {
          try {
            const detailsRequestBody = { details: state.data.details };
            logApi('/payments/details', 'Request', detailsRequestBody);
            const res = await fetch('/api/payments/details', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(detailsRequestBody),
            });
            const result = await res.json();
            logApi('/payments/details', 'Response', result);

            if (result.error) {
              showError(result.error);
              actions.reject();
              return;
            }
            if (result.pspReference) lastPspReference = result.pspReference;
            actions.resolve(result);
          } catch (err) {
            console.error('onAdditionalDetails error:', err);
            showError(err.message || 'Details request failed');
            actions.reject();
          }
        },

        onPaymentCompleted: (result, _component) => {
          console.log('Payment completed:', result.resultCode);
          showPsp(lastPspReference);
        },

        onPaymentFailed: (result, _component) => {
          console.log('Payment failed:', result?.resultCode);
          showPsp(lastPspReference);
        },

        onError: (error, _component) => {
          console.error('Checkout error:', error);
          const msg = error.message || JSON.stringify(error);
          if (/applepay|apple pay/i.test(msg)) return;
          showError(msg);
        },
      });

      // ── Mount Drop-in ───────────────────────────────────────────────────
      const dropin = new Dropin(adyenCheckout, {
        onReady: () => {
          document.getElementById('spinner').classList.remove('active');
          document.getElementById('dropin-container').style.display = '';
          setupTestCardsPanel();
        },
        openFirstPaymentMethod: true,
        showStoredPaymentMethods: true,
        showRemovePaymentMethodButton: true,
        paymentMethodsConfiguration: {
          card: {
            enableStoreDetails: true,
            billingAddressRequired,
            ...(billingAddressRequired && { billingAddressMode }),
          },
          wechatpayQR: {
            countdownTime: 59,
          },
        },
        onDisableStoredPaymentMethod: async (storedPaymentMethod, resolve, reject) => {
          try {
            const res = await fetch(`/api/storedPaymentMethods/${storedPaymentMethod}`, {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ shopperRef }),
            });
            if (res.ok) {
              resolve();
            } else {
              const err = await res.json();
              showError(err.error || 'Failed to remove card');
              reject();
            }
          } catch (e) {
            showError('Failed to remove card');
            reject();
          }
        },
      }).mount('#dropin-container');

      // ── Test cards side panel ─────────────────────────────────────────

          ]},
          { scheme: '3D Secure 2', cards: [
            { label: 'Visa',             number: '4917610000000000' },
            { label: 'Visa Classic',     number: '4166676676676746' },
            { label: 'Mastercard',       number: '5454545454545454' },
            { label: 'Mastercard Credit', number: '2222400010000008' },
            { label: 'Amex',             number: '371449635398431', cvc: '7373' },
            { label: 'Discover',         number: '6011111111111117' },
            { label: 'JCB / Mastercard', number: '3566111111111113' },
            { label: 'Diners',           number: '30569309025904' },
            { label: 'Bancontact / Maestro', number: '6703444444444449', cvc: 'None' },
            { label: 'Maestro',          number: '5000550000000029', cvc: 'None' },
            { label: 'UnionPay Credit',  number: '6250947000000014', cvc: '123' },
          ]},
        ];

        const DEFAULT_EXP = '03/30';
        const DEFAULT_CVC = '737';

        const LOGO_BASE = 'https://checkoutshopper-test.adyen.com/checkoutshopper/images/logos/';
        const SCHEME_LOGOS = {
          'Visa': 'visa',
          'Mastercard': 'mc',
          'American Express': 'amex',
          'Bancontact': 'bcmc',
          'Cartes Bancaires': 'cartebancaire',
          'China UnionPay': 'cup',
          'Dankort': 'dankort',
          'Diners': 'diners',
          'Discover': 'discover',
          'Elo': 'elo',
          'Hipercard': 'hipercard',
          'JCB': 'jcb',
          'Maestro': 'maestro',
          'Eftpos': 'eftpos_australia',
          'UATP': 'uatp',
          'Visa Electron': 'visaelectron',
          'V Pay': 'vpay',
        };

        const panel = document.getElementById('test-cards-panel');
        const list = panel.querySelector('.tc-list');

        const copyHandler = (btn, number) => async () => {
          try {
            await navigator.clipboard.writeText(number);
          } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = number;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 1200);
        };

        if (list.childElementCount === 0) {
          TEST_CARD_GROUPS.forEach((g) => {
            const title = document.createElement('div');
            title.className = 'tc-group-title';
            const logo = SCHEME_LOGOS[g.scheme];
            if (logo) {
              const img = document.createElement('img');
              img.className = 'tc-logo';
              img.src = LOGO_BASE + logo + '.svg';
              img.alt = '';
              img.onerror = () => img.remove();
              title.appendChild(img);
            } else if (g.scheme === '3D Secure 2') {
              const badge = document.createElement('span');
              badge.className = 'tc-logo-emoji';
              badge.textContent = '🔒';
              title.appendChild(badge);
            }
            const label = document.createElement('span');
            label.textContent = g.scheme;
            title.appendChild(label);
            list.appendChild(title);

            g.cards.forEach((c) => {
              const display = c.number.replace(/(.{4})/g, '$1 ').trim();
              const meta = [];
              if (c.exp && c.exp !== DEFAULT_EXP) meta.push('Exp ' + c.exp);
              if (c.cvc && c.cvc !== DEFAULT_CVC) meta.push('CVC ' + c.cvc);

              const row = document.createElement('div');
              row.className = 'tc-row';
              row.innerHTML =
                '<div class="tc-info">' +
                '<span class="tc-brand"></span>' +
                '<span class="tc-number"></span>' +
                '<span class="tc-meta"></span>' +
                '</div>' +
                '<button class="tc-copy" type="button">Copy</button>';
              row.querySelector('.tc-brand').textContent = c.label;
              row.querySelector('.tc-number').textContent = display;
              const metaEl = row.querySelector('.tc-meta');
              if (meta.length) {
                metaEl.textContent = meta.join(' · ');
              } else {
                metaEl.remove();
              }
              const btn = row.querySelector('.tc-copy');
              btn.addEventListener('click', copyHandler(btn, c.number));
              list.appendChild(row);
            });
          });
        }

        const card = document.querySelector('.card');
        const GAP = 24;
        const alignPanel = () => {
          panel.style.top = card.offsetTop + 'px';
          panel.style.height = card.offsetHeight + 'px';
          const left = card.offsetLeft - GAP - panel.offsetWidth;
          panel.style.left = Math.max(12, left) + 'px';
        };

        const isCardOpen = () => {
          const sel = document.querySelector('.adyen-checkout__payment-method--selected');
          if (!sel) return false;
          if (sel.className.includes('--scheme')) return true;
          return !!sel.querySelector('.adyen-checkout__card-input');
        };
        const update = () => {
          const open = isCardOpen();
          panel.classList.toggle('visible', open);
          if (open) alignPanel();
        };

        const container = document.getElementById('dropin-container');
        new MutationObserver(update).observe(container, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ['class'],
        });
        new ResizeObserver(() => {
          if (panel.classList.contains('visible')) alignPanel();
        }).observe(card);
        window.addEventListener('resize', () => {
          if (panel.classList.contains('visible')) alignPanel();
        });
        update();
      }

      function showError(msg) {
        const banner = document.getElementById('error-banner');
        banner.textContent = '⚠️ ' + msg;
        banner.style.display = 'block';
      }

      function showPsp(psp) {
        if (!psp) return;
        const el = document.getElementById('psp-info');
        el.innerHTML = '<strong>PSP Reference:</strong> ' + psp;
        el.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
